<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Linux-команды — памятка DevOps</title>
  <meta name="theme-color" content="#111214">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="src/styles.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
<header class="hdr">
  <div class="hdr-top">
    <div>
      <h1><span class="prompt">$</span>Linux-команды — памятка DevOps</h1>
      <div class="hdr-sub">навигация · права · процессы · systemd · диск · сеть · диагностика · git · загрузка</div>
    </div>
    <button class="btn-theme" id="btn-theme" title="Переключить тему">◐ тема</button>
  </div>
  <div class="search-wrap">
    <span class="ico">⌕</span>
    <input type="search" id="q" placeholder="Поиск по командам и описанию…" autocomplete="off" spellcheck="false">
    <button class="btn-clear" id="btn-clear" title="Очистить">×</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="toc" id="toc"></div>
  <div class="counter" id="counter"></div>
</header>
<main class="wrap" id="main"></main>
<footer class="footer">
  <kbd>/</kbd> — фокус в поиск &nbsp;·&nbsp; <kbd>Esc</kbd> — сброс и blur &nbsp;·&nbsp; чипы + поиск работают вместе
</footer>
</body>
</html>
